<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Music History Analyzer</title>
    <meta name="description" content="YouTube Music の再生履歴（Google Takeout）をブラウザ内で集計・可視化するツール">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23e5322d'/%3E%3Cpath d='M10 8v8l6-4z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <a class="brand" href="./" aria-label="YouTube Music History Analyzer">
                <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path d="M10 8v8l6-4z"/></svg>
                <span class="brand__name">YouTube Music History Analyzer</span>
            </a>
            <div id="header-controls" class="header-controls"></div>
            <button type="button" id="theme-btn" class="icon-btn" data-action="theme" data-theme="auto" aria-label="テーマを切り替え"></button>
        </div>
        <nav id="tabs" class="tabs" role="tablist" aria-label="表示の切り替え"></nav>
    </header>

    <main id="main" class="main">
        <p class="loading">読み込み中…</p>
    </main>

    <footer class="app-footer">
        <p>再生履歴はブラウザの中だけで処理されます。 <a href="https://github.com/pokobi/YouTube-Music-History-Analyzer" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <dialog id="detail" class="detail" aria-label="詳細"><div id="detail-content" class="detail__content"></div></dialog>
    <datalist id="artist-options"></datalist>
    <datalist id="song-options"></datalist>
    <input type="file" id="file-input" accept=".json,.zip,application/json,application/zip" multiple hidden>

    <div id="drop-overlay" class="drop-overlay" hidden><p>ドロップして読み込む</p></div>
    <div id="busy" class="busy" hidden><div class="busy__box"><span class="spinner" aria-hidden="true"></span><p class="busy__text" aria-live="polite"></p></div></div>
    <div id="toasts" class="toasts"></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <button type="button" id="to-top" class="to-top" data-action="to-top" aria-label="ページの先頭へ">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
    <noscript><p class="loading">このツールを使うには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
